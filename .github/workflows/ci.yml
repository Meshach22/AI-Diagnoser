name: CI/CD Pipeline (v2.4-Enterprise)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  validate-test-build:
    name: Build, Static Validation & Full-Stack Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Static Syntax & Compilation Validation
        run: |
          python -m py_compile main.py core/*.py pipelines/*.py backend/*.py tests/*.py

      - name: Run Full Backend Test Suite
        env:
          GEMINI_API_KEY: "ci_dummy_gemini_key"
          OPENAI_API_KEY: "ci_dummy_openai_key"
          GROQ_API_KEY: "ci_dummy_groq_key"
          DEEPSEEK_API_KEY: "ci_dummy_deepseek_key"
          AUTH_ENFORCE_API: "true"
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend TypeScript Validation
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend Production Build
        working-directory: frontend
        run: npm run build

      - name: Container Dry-Run Docker Build
        run: |
          docker build -t studio:ci .
